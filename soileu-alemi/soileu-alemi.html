<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сөйлеу әлемі</title>
<meta name="description" content="6 жастағы балаларға арналған логопедиялық түзету-дамыту ойындары">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#fff7ea;--card:#fff;--ink:#2b2a4c;--mut:#6b6a8a;--pri:#7c5cff;--pri2:#5a3de0;--sens:#14a3a0;--mot:#ff7a3d;--ok:#22b573;--bad:#ef5a5a;--yel:#ffd23f;--line:#eadfce;--sh:0 6px 0 rgba(43,42,76,.10),0 12px 24px rgba(43,42,76,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1d1b33;--card:#2a2748;--ink:#f3f0ff;--mut:#b6b2da;--line:#3d3a66;--sh:0 6px 0 rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:1120px;margin:0 auto;padding:16px 16px 40px}
a{color:var(--pri2)}
h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:.4em 0 .2em;line-height:1.15}
h2{font-size:1.4rem;margin:.2em 0 .5em}h3{margin:.2em 0}
.lead{font-size:1.15rem;color:var(--mut);margin-top:0}
.small{font-size:.85rem;color:var(--mut)}
.center{justify-content:center}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--yel);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 16px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:1.25rem}
.logo span{font-size:1.7rem}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{padding:8px 12px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.95rem}
nav a:hover{background:rgba(124,92,255,.12)}nav a.on{background:var(--pri);color:#fff}
.tools{display:flex;gap:8px;align-items:center}
.kid select{font:inherit;font-size:.9rem;border-radius:10px;border:2px solid var(--line);padding:4px 6px;background:var(--bg);color:var(--ink)}
.ic{border:0;background:var(--bg);border-radius:12px;min-width:40px;height:40px;font-size:1.1rem;cursor:pointer;color:var(--ink);font-weight:700}
.ic.off{opacity:.35;text-decoration:line-through}
.ic.big{width:56px;height:56px;font-size:1.6rem;background:var(--yel);border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:800;border:0;border-radius:16px;padding:12px 22px;background:var(--pri);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--pri2);text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pri2)}
.btn.big{font-size:1.25rem;padding:16px 30px}.btn.sm{padding:7px 14px;font-size:.9rem;box-shadow:0 3px 0 var(--pri2)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #138a56}.btn.alt{background:var(--mot);box-shadow:0 5px 0 #d85a1d}
.btn:disabled{opacity:.5}
.btn.mic.rec{background:var(--bad);box-shadow:0 5px 0 #b93a3a;animation:pulse 1s infinite}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.games{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card,.gcard,.panel,.stat{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:18px}
.card{text-decoration:none;color:var(--ink);transition:transform .12s;display:block}.card:hover,.gcard:hover{transform:translateY(-4px)}
.card .ce{font-size:3rem}.tag{display:inline-block;background:var(--yel);color:#4a3b00;border-radius:99px;padding:2px 12px;font-size:.8rem;font-weight:800}
.card p{color:var(--mut);margin:.3em 0 .6em;font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;background:linear-gradient(135deg,#7c5cff,#4dabf7);color:#fff;border-radius:28px;padding:28px;margin-bottom:20px;box-shadow:var(--sh)}
.hero .lead{color:#efeaff}.heroart{font-size:3.4rem;align-self:center;text-align:center;max-width:220px}
.hero .btn.ghost{color:#222}
@media(max-width:700px){.hero{grid-template-columns:1fr}.heroart{display:none}}
.panel{margin:16px 0}.panel ul{margin:.3em 0;padding-left:1.2em}
.gcard{position:relative;text-decoration:none;color:var(--ink);display:block;border-top:8px solid var(--sens);transition:transform .12s}
.gcard.mot{border-top-color:var(--mot)}
.gcard .gn{position:absolute;right:14px;top:10px;font-weight:900;font-size:1.5rem;opacity:.25}
.gcard .ge{font-size:2.6rem}.gcard small{color:var(--mut);display:block;font-size:.8rem;line-height:1.3;margin-top:6px}
.st{letter-spacing:3px}
.crumb{margin-top:6px}.gh{border-left:10px solid var(--sens);padding:2px 0 2px 14px;margin:10px 0}.gh.mot{border-color:var(--mot)}.gh.prep{border-color:var(--yel)}
.gh .gn{background:var(--sens);color:#fff;border-radius:99px;padding:2px 12px;font-size:.8rem;font-weight:800}.gh.mot .gn{background:var(--mot)}
.vis{color:var(--mut);margin:.2em 0;font-size:.95rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab{font:inherit;font-weight:800;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}.tab small{display:block;font-size:.7rem;font-weight:400}
.task{background:rgba(255,210,63,.25);border-radius:14px;padding:10px 14px;margin:10px 0}
.stage{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:18px;min-height:360px}
.pane>.stage{margin-top:10px}
.dots{display:flex;gap:6px;align-items:center;margin-bottom:10px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.done{background:var(--ok)}.dots i.cur{background:var(--pri);transform:scale(1.3)}.dots span{margin-left:auto;color:var(--mut);font-size:.9rem}
.prompt{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.ptxt{font-size:1.5rem;font-weight:800}.ptxt.big{font-size:1.6rem;text-align:center;margin:12px 0}
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:14px 0}
.opts.n2{grid-template-columns:repeat(2,minmax(150px,260px));justify-content:center}.opts.n3{grid-template-columns:repeat(3,minmax(130px,230px));justify-content:center}
@media(max-width:560px){.opts.n3,.opts.n2{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}}
.opt{position:relative;font:inherit;border:4px solid var(--line);background:var(--bg);border-radius:22px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center;color:var(--ink);transition:transform .1s,border-color .1s}
.opt:hover{transform:scale(1.03)}.opt.sel{border-color:var(--pri);background:rgba(124,92,255,.15)}.opt.dim{opacity:.4}
.opt.hint{animation:blink .7s infinite}
.oe{font-size:4rem;line-height:1.05;text-align:center}.opts.n5 .oe,.opts.n6 .oe{font-size:3.2rem}
.ol{font-weight:800;font-size:1rem;text-align:center}.nolabels .ol{display:none}
.badge{position:absolute;top:6px;right:8px;min-width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}.badge:empty{display:none}
.ovl{position:relative;display:inline-block}.ovl i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.5);font-style:normal}
.barv{display:inline-block;background:var(--pri);border-radius:8px}
.chip,.bigletter{font-size:2.6rem;font-weight:900;color:var(--pri2);background:#fff;border:4px solid var(--pri);border-radius:18px;padding:2px 18px}
.bigletter{border:0;background:none;font-size:5rem}.vl{text-align:center;transition:transform .08s;font-size:8rem;margin:6px 0}
.tint-y{filter:hue-rotate(50deg) saturate(1.6) brightness(1.2);display:inline-block}
.bigpic{font-size:7rem;text-align:center;line-height:1.1;margin:6px 0;min-height:110px}
.target{font-size:2.4rem;font-weight:900;text-align:center;color:var(--pri2);letter-spacing:2px}
.hintline{text-align:center;color:var(--mut)}
.built{text-align:center;font-size:2.2rem;font-weight:900;min-height:56px;border-bottom:4px dashed var(--line);margin:6px 40px;color:var(--pri2)}
.fb{min-height:34px;text-align:center;font-weight:800;font-size:1.25rem;margin:8px 0}
.fb.good{color:var(--ok);font-size:1.7rem;animation:pop .4s}.fb.bad{color:var(--bad)}.fb.info{color:var(--mut)}
.next{display:flex;margin:14px auto 0}
.meter{height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative;margin:10px 0}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ddc97,#ffd23f,#ff6b6b);border-radius:99px;transition:width .05s}
.meter.marked{overflow:visible}.meter em{position:absolute;top:-4px;width:4px;height:24px;background:var(--ink);left:0}
.status,.heard{text-align:center;margin:4px 0;color:var(--mut)}.heard{font-weight:800;color:var(--ink);font-size:1.15rem;min-height:1.5em}
.msg{background:#ffe3e3;color:#7d1d1d;border-radius:12px;padding:10px 14px;margin:8px 0}
.finish{text-align:center;padding:20px 0;position:relative}.trophy{font-size:5rem;animation:pop .6s}.bigstars{font-size:2.4rem;text-align:center;letter-spacing:6px}
.timer{font-size:3rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}.timer.goal{color:var(--ok)}
.count{font-size:4.5rem;text-align:center;font-weight:900;color:var(--pri2)}.meter.prog i{background:var(--pri)}
.slider{display:block;margin:8px 0}.slider input{width:min(320px,70%);vertical-align:middle}
/* камера */
.cam{margin:10px 0}.cam.small{display:none}.cam.small.show{display:block}
.camframe{position:relative;max-width:420px;aspect-ratio:4/3;background:#222;border-radius:20px;overflow:hidden;margin:0 auto}
.camframe video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.camoff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#bbb;font-size:3rem;text-align:center}.camoff span{font-size:1rem}.camoff[hidden]{display:none}
.camctl{display:flex;gap:8px;justify-content:center;margin:8px 0}.snaps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.snaps img{width:96px;height:72px;object-fit:cover;border-radius:10px;border:3px solid var(--yel)}
/* сахналар */
.scene{position:relative;height:300px;border-radius:22px;overflow:hidden;background:linear-gradient(#bfe9ff,#eaf8ff);border:3px solid var(--line);margin:10px 0}
.bub{position:absolute;bottom:-40px;font-size:var(--s);animation:floatup 3.2s ease-out forwards}
.scene.feather{background:linear-gradient(#e7f4ff,#fff)}.zone{position:absolute;top:8%;left:0;right:0;height:26%;border-top:3px dashed var(--ok);border-bottom:3px dashed var(--ok);background:rgba(34,181,115,.12);color:var(--ok);font-weight:800;padding:2px 10px}
.feath{position:absolute;left:50%;bottom:4%;font-size:4rem;transition:bottom .08s;transform:translateX(-50%)}
.scene.wind{background:linear-gradient(#d9f2c4,#f3ffe6)}.leaf{position:absolute;left:3%;font-size:3rem}.flag{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;font-size:3rem;border-left:4px dashed var(--ok)}
.artgrid{grid-template-columns:240px 1fr}@media(max-width:800px){.artgrid{grid-template-columns:1fr}}
.exlist{display:flex;flex-direction:column;gap:8px}.ex{font:inherit;font-weight:800;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.ex.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.artic{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:center}@media(max-width:600px){.artic{grid-template-columns:1fr}}
.face{width:100%;max-width:230px;display:block;margin:auto}
.a-swing{animation:swing 2s ease-in-out infinite}.a-click{animation:click 1s ease-in-out infinite}.a-lick{animation:lick 2s ease-in-out infinite}
.string{display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);padding:10px;border-radius:16px;border-bottom:6px solid #c9a97a}.bead{font-size:2.4rem;width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer}.bead.empty{border:3px dashed var(--line);border-radius:50%}.bead.big{font-size:3.2rem;width:72px;height:72px}
.tray{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.item{font-size:3rem;border:4px solid var(--line);background:var(--bg);border-radius:18px;width:84px;height:84px;cursor:pointer}.item.sel{border-color:var(--pri);transform:scale(1.1)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.bin{font:inherit;border:4px solid var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);border-radius:18px;min-height:130px;cursor:pointer;color:var(--ink)}.binin{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:1.8rem;padding:4px}
.clay{width:100%;max-width:520px;touch-action:none;border:3px solid var(--line);border-radius:16px;display:block;margin:8px 0}.dot{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.claps{font-size:3rem;letter-spacing:6px}
/* нәтиже */
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left}.tbl th{background:rgba(124,92,255,.12)}.tbl td.c{text-align:center;white-space:nowrap}
.tbl select,.tbl input{font:inherit;padding:6px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.stat{text-align:center}.stat b{display:block;font-size:2rem;color:var(--pri2)}.stat span{color:var(--mut);font-size:.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}.pill{background:var(--bg);border:2px solid var(--line);border-radius:99px;padding:4px 14px;font-size:.9rem}.pill.on{border-color:var(--ok);background:rgba(34,181,115,.12)}
.obsrec{border:2px solid var(--line);border-radius:16px;padding:10px;margin:10px 0}
details summary{cursor:pointer;font-weight:800;margin:6px 0}
footer{margin-top:30px}.warn{background:#fff3cd;color:#5a4500;border-radius:16px;padding:14px 18px;border:2px solid #ffd23f;font-size:.95rem}
@media(prefers-color-scheme:dark){.warn{background:#4a3f10;color:#ffe9a0}.msg{background:#5a2323;color:#ffd7d7}.chip{background:#fff}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50}.modal .box{background:var(--card);padding:22px;border-radius:20px;width:min(360px,92vw)}.modal input{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}.confetti i{position:absolute;top:-10px;width:10px;height:16px;border-radius:3px;animation:fall 1.6s ease-in forwards}
.step{position:relative}
.shake{animation:shake .4s}
@keyframes pulse{50%{transform:scale(1.04)}}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes blink{50%{border-color:var(--yel);background:rgba(255,210,63,.35)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fall{to{transform:translate(var(--dx),420px) rotate(720deg);opacity:0}}
@keyframes floatup{to{transform:translate(var(--x),-340px);opacity:0}}
@keyframes swing{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(38deg)}}
@keyframes click{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes lick{0%,100%{transform:rotate(0)}50%{transform:rotate(180deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
@media print{header,nav,.tools,.btn,.tabs,footer .small,#app>.hero{display:none!important}body{background:#fff;color:#000}.panel{box-shadow:none;border:1px solid #ccc;break-inside:avoid}details:not([open]) *{display:none}}

</style>
</head>
<body>
<main id="app"></main>
<script>
/* «Сөйлеу әлемі» — құжаттағы барлық материал деректері */
const o = (e, l, k) => ({ e, l, k: k || l });
const pk = (say, opts, ans, x = {}) => ({ t: 'pick', say, opts, ans: [].concat(ans), ...x });
const sy = (pic, say, target, x = {}) => ({ t: 'say', pic, say, target, ...x });
const fr = (pic, say, min, x = {}) => ({ t: 'say', pic, say, free: min, ...x });
const big = (e, px) => `<span style="font-size:${px}px;line-height:1">${e}</span>`;
const chip = (t) => `<b class="chip">${t}</b>`;
const letter = (t) => `<b class="bigletter">${t}</b>`;
const tint = (e) => `<span class="tint-y">${e}</span>`;

/* ---------- Қайталанатын суреттер ---------- */
const ALMA = o('🍎', 'Алма'), DOP = o('⚽', 'Доп'), MASH = o('🚗', 'Машина'), MYS = o('🐱', 'Мысық'), IT = o('🐶', 'Ит');
const SIYR = o('🐮', 'Сиыр'), QOY = o('🐑', 'Қой');
const RED = o('🔴', 'Қызыл'), BLUE = o('🔵', 'Көк'), YEL = o('🟡', 'Сары'), GRN = o('🟢', 'Жасыл');
const SLEEP = o('😴', 'Ұйықтап жатыр'), RUN = o('🏃', 'Жүгіріп жатыр'), EAT = o('🍽️', 'Тамақ ішіп жатыр'), WASH = o('🧼', 'Қол жуып жатыр'), SIT = o('🪑', 'Отырып жатыр');
const EYE = o('👁️', 'Көз'), NOSE = o('👃', 'Мұрын'), EAR = o('👂', 'Құлақ'), MOUTH = o('👄', 'Ауыз'), HAND = o('✋', 'Қол'), FOOT = o('🦶', 'Аяқ');
const APPLE = o('🍎', 'Алма'), BANANA = o('🍌', 'Банан'), CARROT = o('🥕', 'Сәбіз'), CUC = o('🥒', 'Қияр'), TOM = o('🍅', 'Қызанақ');
const BELL = o('🔔', 'Қоңырау'), DRUM = o('🥁', 'Барабан'), RATTLE = o('🪇', 'Сылдырмақ'), WHISTLE = o('📣', 'Ысқырық');
const BUS = o('🚌', 'Автобус'), TRAIN = o('🚆', 'Пойыз'), PLANE = o('✈️', 'Ұшақ'), BIKE = o('🚲', 'Велосипед'), BOAT = o('🚤', 'Қайық');
const WATER = o('🌊', 'Су'), NEST = o('🪺', 'Ұя'), KENNEL = o('🏠', 'Үйшік'), BARN = o('🛖', 'Қора');
const BOY = o('🧒', 'Бала'), GIRL = o('👧', 'Қыз');

/* ---------- 30 ойын ---------- */
const GAMES = [
  /* ================= СЕНСОРЛЫҚ ================= */
  {
    id: 1, kind: 'sens', title: 'Сөзді тыңда да, суретті тап', emoji: '👂',
    vis: 'Алма, доп, машина, мысық және ит бейнеленген карточкалар.',
    desc: ['«Алма» деген сөзді тыңдап, алма суретін таңдау.', '«Допты көрсет», «Мысықты көрсет» деген екі түрлі нұсқауды орындау.', '«Қызыл допты көрсет» деген сөздік нұсқауды тыңдап, қажетті суретті таңдау.'],
    levels: [
      [pk('Алма', [ALMA, DOP, MASH], 'Алма')],
      [pk('Допты көрсет', [ALMA, DOP, MASH, MYS, IT], 'Доп'), pk('Мысықты көрсет', [ALMA, DOP, MASH, MYS, IT], 'Мысық')],
      [pk('Қызыл допты көрсет', [o('🔴', 'Қызыл доп'), o('🔵', 'Көк доп'), o('🟡', 'Сары доп'), ALMA], 'Қызыл доп')],
    ],
  },

    h('h3', {}, '📷 Нағыз ермексаз жұмысын көрсету'), cam.el));
}

/* ----- 6. Еліктеу ----- */
function prepImit(host) {
  const an = [['🐱', 'Мысық', 'мияу', ['мияу', 'мяу', 'миау', 'мау']], ['🐶', 'Ит', 'ав-ав', ['ав ав', 'аф аф', 'гав гав', 'ав']], ['🐮', 'Сиыр', 'мө-ө', ['мо', 'му', 'мөө', 'мое']]];
  const sylls = ['ма', 'мо', 'му', 'ба', 'бо', 'бу'];
  const words = [['👩', 'Ана', 'ана'], ['👴', 'Ата', 'ата'], ['⚽', 'Доп', 'доп'], ['🍎', 'Алма', 'алма']];
  tabset(host, [
    ['Қалай дыбыстайды?', pane => { pane.append(h('p', { class: 'task' }, 'Мысық – мияу; ит – ав-ав; сиыр – мө-ө.'), h('div', { class: 'stage' })); return runSteps($('.stage', pane), an.map(a => sy(a[0], `${a[1]} қалай дыбыстайды?`, a[3], { listen: a[2], show: a[2] })), 'imit1'); }],
    ['Дыбысты қайтала', pane => { pane.append(h('p', { class: 'task' }, 'МА, МО, МУ; БА, БО, БУ буындарын қайталау.'), h('div', { class: 'stage' })); return runSteps($('.stage', pane), sylls.map(s => sy(chip(s.toUpperCase()), `${s.toUpperCase()} буынын қайтала`, [s, s + 'а'], { listen: s })), 'imit2'); }],
    ['Менің алғашқы сөздерім', pane => { pane.append(h('p', { class: 'task' }, 'АНА, АТА, ДОП, АЛМА сөздерін тыңдау, қайталау және суреттерімен сәйкестендіру.'), h('div', { class: 'stage' })); const all = words.map(w => o(w[0], w[1]));
      return runSteps($('.stage', pane), words.flatMap(w => [sy(w[0], `${w[1]} — тыңда да, қайтала`, [w[2]], { listen: w[2], show: w[1].toUpperCase() }), pk(`${w[1]} — суретін тап`, all, w[1])]), 'imit3'); }],
  ]);
}

/* ================= НӘТИЖЕ ================= */
function indicatorStat(ind) {
  let indep = 0, total = 0, any = 0;
  ind.games.forEach(id => [0, 1, 2].forEach(l => { const r = (Store.kid.prog[id] || {})[l]; if (r) { indep += r.indep; total += r.total; any++; } }));
  return { pct: total ? Math.round(indep / total * 100) : null, any };
}
function viewResults() {
  const kid = Store.kid;
  const grid = h('table', { class: 'tbl' }, h('thead', {}, h('tr', {}, h('th', {}, '№'), h('th', {}, 'Ойын'), h('th', {}, '1-деңгей'), h('th', {}, '2-деңгей'), h('th', {}, '3-деңгей'))),
    h('tbody', {}, GAMES.map(g => h('tr', {}, h('td', {}, g.id), h('td', {}, h('a', { href: '#/game/' + g.id }, g.title)), [0, 1, 2].map(l => h('td', { class: 'c' }, h('a', { href: `#/game/${g.id}/${l}` }, lvStars(g.id, l) ? stars(lvStars(g.id, l)) : '—')))))));
  const prepRows = [['p:artic', 'Артикуляция'], ['p:voice', 'Дауысты дыбыстар'], ['p:voice2', 'Дауысымды өзгертемін'], ['p:echo', 'Жаңғырық'], ['p:hear1', 'Не естілді?'], ['p:hear2', 'Шапалақ ырғағы'], ['p:hear3', 'Жануарды таны'], ['p:beads', 'Моншақ тізу'], ['p:sort', 'Түстерді жина'], ['p:clay', 'Ермексаз'], ['p:imit1', 'Қалай дыбыстайды?'], ['p:imit2', 'Буындар'], ['p:imit3', 'Алғашқы сөздер']];
  const pst = k => { const r = kid.prog[k]; return r ? (r.stars || (r[0] && r[0].stars) || 0) : 0; };
  const prep = h('div', { class: 'chips' }, prepRows.map(([k, t]) => h('span', { class: 'pill' + (pst(k) ? ' on' : '') }, t, ' ', pst(k) ? stars(pst(k)) : '')));
  const done = GAMES.reduce((a, g) => a + [0, 1, 2].filter(l => lvStars(g.id, l)).length, 0), st = GAMES.reduce((a, g) => a + gameStars(g.id), 0);
  const sum = h('div', { class: 'grid stats' }, stat(`${done}/90`, 'орындалған деңгей'), stat(`${st}/270`, 'жұлдыз'), stat(`${GAMES.filter(g => g.kind === 'sens').reduce((a, g) => a + gameStars(g.id), 0)}/135`, 'сенсорлық'), stat(`${GAMES.filter(g => g.kind === 'mot').reduce((a, g) => a + gameStars(g.id), 0)}/135`, 'моторлық'));
  // бақылау кестесі

  const rows = INDICATORS.map(ind => {
    const s = indicatorStat(ind), sug = s.pct == null ? '' : s.pct >= 70 ? 'Өздігінен' : 'Көмекпен';
    const sel = h('select', {}, h('option', { value: '' }, '—'), ['Өздігінен', 'Көмекпен'].map(v => h('option', { value: v, selected: v === sug }, v)));
    const note = h('input', { type: 'text', placeholder: 'Ескертпе…' });
    return { ind, sel, note, tr: h('tr', {}, h('td', {}, h('b', {}, ind.k)), h('td', {}, sel, s.pct == null ? h('div', { class: 'small' }, 'ойын деректері жоқ') : h('div', { class: 'small' }, `ойындар бойынша: ${s.pct}% өздігінен`)), h('td', {}, note)) };
  });
  const hist = h('div', {}); const renderHist = () => {
    hist.innerHTML = ''; if (!kid.obs.length) { hist.append(h('p', { class: 'small' }, 'Сақталған бақылау әзірге жоқ.')); return; }
    kid.obs.slice().reverse().forEach((o, ri) => { const idx = kid.obs.length - 1 - ri; hist.append(h('div', { class: 'obsrec' }, h('div', { class: 'row' }, h('b', {}, `${o.date} · ${Store.d.cur}`), h('button', { class: 'btn sm ghost', onclick: () => { kid.obs.splice(idx, 1); Store.save(); renderHist(); } }, '🗑')),
      h('table', { class: 'tbl' }, h('tbody', {}, o.rows.map(r => h('tr', {}, h('td', {}, r.k), h('td', {}, r.v || '—'), h('td', {}, r.n || '')))))));
    });
  };
  renderHist();
  const csv = () => { const lines = [['Бала', 'Күні', 'Көрсеткіш', 'Нәтиже', 'Ескертпе'], ...kid.obs.flatMap(o => o.rows.map(r => [Store.d.cur, o.date, r.k, r.v, r.n]))]; const b = new Blob(['﻿' + lines.map(l => l.map(c => '"' + String(c || '').replace(/"/g, '""') + '"').join(',')).join('\n')], { type: 'text/csv' }); const a = h('a', { href: URL.createObjectURL(b), download: 'baqylau.csv' }); document.body.append(a); a.click(); a.remove(); };
  root.append(h('h1', {}, `📊 ${Store.d.cur}: нәтижелер`), sum,
    h('section', { class: 'panel' }, h('h2', {}, 'V. Баланың нәтижесін бақылау'), h('p', { class: 'small' }, 'Нәтиже ойындардағы жауаптарға қарап ұсынылады, бірақ соңғы бағаны логопед қояды.'),
      h('div', { class: 'row' }, h('label', {}, 'Күні: ', date)),
      h('table', { class: 'tbl obs' }, h('thead', {}, h('tr', {}, h('th', {}, 'Бағалау көрсеткіші'), h('th', {}, 'Нәтиже нұсқасы'), h('th', {}, 'Ескертпе'))), h('tbody', {}, rows.map(r => r.tr))),
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => { kid.obs.push({ date: date.value, rows: rows.map(r => ({ k: r.ind.k, v: r.sel.value, n: r.note.value })) }); Store.save(); renderHist(); playSound('ok'); } }, '💾 Бақылауды сақтау'), h('button', { class: 'btn ghost', onclick: csv }, '⬇ CSV жүктеу'), h('button', { class: 'btn ghost', onclick: () => print() }, '🖨 Басып шығару'))),
    h('section', { class: 'panel' }, h('h2', {}, 'Сақталған бақылаулар'), hist),
    h('section', { class: 'panel' }, h('h2', {}, 'Ойындар бойынша жұлдыздар'), h('details', { open: true }, h('summary', {}, 'Кестені жасыру/көрсету'), grid)),
    h('section', { class: 'panel' }, h('h2', {}, 'Дайындық кезеңі'), prep),
    h('p', { class: 'small' }, 'Деректер тек осы құрылғының браузерінде сақталады. ', h('button', { class: 'btn sm ghost', onclick: () => { if (confirm(`${Store.d.cur} баласының барлық нәтижесін өшіру керек пе?`)) { kid.prog = {}; kid.obs = []; Store.save(); route(); } } }, 'Нәтижені тазалау')));
}
const stat = (n, t) => h('div', { class: 'stat' }, h('b', {}, n), h('span', {}, t));
